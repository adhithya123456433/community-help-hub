<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | CommunityHelp Hub</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .notfound-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    .notfound-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 3rem 2rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
    }
    .badge-404 {
      display: inline-block;
      padding: 0.25rem 0.85rem;
      border-radius: 9999px;
      background-color: #fee2e2;
      color: #b91c1c;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .notfound-title {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }
    .notfound-text {
      color: #64748b;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn-404-primary {
      display: block;
      background-color: #059669;
      color: #ffffff;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 0.15s;
    }
    .btn-404-primary:hover {
      background-color: #047857;
    }
    .btn-row {
      display: flex;
      gap: 0.75rem;
    }
    .btn-404-secondary {
      flex: 1;
      display: block;
      background-color: #2563eb;
      color: #ffffff;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-404-secondary:hover {
      background-color: #1d4ed8;
    }
    .btn-404-outline {
      flex: 1;
      display: block;
      background-color: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-404-outline:hover {
      background-color: #f1f5f9;
    }
  </style>
</head>
<body>
  <div class="notfound-container">
    <div class="notfound-card">
      <div class="badge-404">404 Error</div>
      <h1 class="notfound-title">Page Not Found</h1>
      <p class="notfound-text">
        The page you are looking for does not exist, has been removed, or has had its name changed.
      </p>
      <div class="btn-group">
        <a href="/" class="btn-404-primary">Return to Home</a>
        <div class="btn-row">
          <a href="/explore-tasks" class="btn-404-secondary">Explore Tasks</a>
          <a href="/impact" class="btn-404-outline">Impact Dashboard</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
